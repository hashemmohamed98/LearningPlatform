services:
  postgres:
    image: postgres:17
    container_name: pathway-postgres
    environment:
      POSTGRES_DB: pathway
      POSTGRES_USER: pathway
      POSTGRES_PASSWORD: pathway
    ports:
      - "5433:5432"
    volumes:
      - pathway-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathway -d pathway"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pathway-db-data: